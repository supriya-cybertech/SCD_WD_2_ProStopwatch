<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Stopwatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stopwatch-container">
    <h1>⏱️ Welcome to Pro Stopwatch</h1>
    <p class="intro">Measure your time accurately and track your laps with ease. Perfect for workouts, coding sprints, or any timed activity!</p>

    <div id="display">00:00:00.000</div>

    <div class="buttons">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
      <button id="lap">Lap</button>
      <button id="theme-toggle">🌙 Toggle Theme</button>
    </div>

    <h3>Lap Times:</h3>
    <ul id="laps"></ul>

    <div class="footer">
      <p>Created by Supriya! | Professional Stopwatch App</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
